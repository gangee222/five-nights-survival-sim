<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIVE NIGHTS — survival sim</title>
<style>
:root {
  --bg: #020202;
  --panel: #0c0c0c;
  --line: #2a2a2a;
  --txt: #c9c9c9;
  --dim: #666;
  --freddy: #7a4a22;
  --bonnie: #6a3fa0;
  --chica: #c99a15;
  --foxy: #a83226;
  --gold: #d9a821;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Courier New", monospace;
}

html, body {
  height: 100%;
  background: #000;
  color: var(--txt);
  overflow: hidden;
}

#root {
  width: 100vw;
  height: 100vh;
  position: relative;
  user-select: none;
}

button {
  cursor: pointer;
  background: linear-gradient(#1c1c1c, #101010);
  color: var(--txt);
  border: 1px solid var(--line);
  padding: 9px 14px;
  border-radius: 4px;
  font-size: 14px;
  transition: background .12s, filter .12s;
}

button:hover {
  filter: brightness(1.25);
}

button:disabled {
  opacity: .3;
  cursor: not-allowed;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: radial-gradient(circle at 50% 30%, #0b0b0b, #000);
  padding: 20px;
  text-align: center;
}

h1 {
  letter-spacing: 6px;
  color: #e8e8e8;
  text-shadow: 0 0 14px #600, 0 0 40px #300;
  font-size: 40px;
}

.sub {
  color: var(--dim);
  letter-spacing: 3px;
}

.menu {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 300px;
}

.menu button {
  padding: 13px;
  font-size: 16px;
  letter-spacing: 1px;
}

.menu button:hover {
  transform: translateY(-1px);
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 18px;
  border-radius: 8px;
  max-width: 660px;
  text-align: left;
  line-height: 1.55;
  box-shadow: 0 0 30px #000;
}

.small {
  font-size: 12px;
  color: var(--dim);
}

#grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 99;
  opacity: .06;
  background-image: repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 2px);
  animation: grainJit .09s steps(2) infinite;
}

@keyframes grainJit {
  50% {
    transform: translateY(1px);
  }
}

#gameRoot {
  position: absolute;
  inset: 0;
  background: #000;
  overflow: hidden;
}

#gameRoot.shake {
  animation: shake .5s linear;
}

@keyframes shake {
  0%, 100% { transform: translate(0); }
  10% { transform: translate(-14px, 8px); }
  20% { transform: translate(12px, -10px); }
  30% { transform: translate(-9px, 5px); }
  40% { transform: translate(9px, 8px); }
  50% { transform: translate(-6px, -6px); }
  60% { transform: translate(6px, 3px); }
  70% { transform: translate(-4px, 6px); }
  80% { transform: translate(3px, -4px); }
  90% { transform: translate(-2px, 2px); }
}

#officeWrap {
  position: absolute;
  inset: 0;
  overflow: hidden;
  cursor: crosshair;
}

#office {
  position: absolute;
  inset: -4%;
  width: 108%;
  height: 108%;
  transition: transform .18s ease-out;
  background: url('https://files.catbox.moe/2mii3u.original') center/cover no-repeat #000;
}

#office::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, #000000a8 100%);
}

#office.dark {
  filter: brightness(.22) saturate(.35);
}

.doorway {
  position: absolute;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: inset 0 0 40px #000;
}

#leftDoorway {
  left: 7%;
  top: 20%;
  width: 20%;
  height: 58%;
}

#rightDoorway {
  right: 6%;
  top: 22%;
  width: 20%;
  height: 56%;
}

.doorway.lit {
  box-shadow: inset 0 0 40px #ffd98c55, 0 0 30px #ffd98c33;
}

.doorway .hall {
  position: absolute;
  inset: 0;
  background: #00000066;
  transition: background .1s;
}

.doorway.lit .hall {
  background: #ffd98c22;
}

.doorPanel {
  position: absolute;
  inset: 0;
  z-index: 3;
  background: repeating-linear-gradient(180deg, #3a3a3a 0 16px, #2a2a2a 16px 32px);
  transform: translateY(-103%);
  transition: transform .16s cubic-bezier(.5, 0, .3, 1);
  box-shadow: inset 0 0 25px #000a;
}

.doorPanel.closed {
  transform: translateY(0);
}

.doorWin {
  position: absolute;
  top: 14%;
  left: 50%;
  transform: translateX(-50%);
  width: 58%;
  height: 30%;
  background: rgba(8, 12, 16, .92);
  border: 4px solid #3c3c3c;
  border-radius: 5px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.doorWin.lit {
  background: rgba(70, 56, 24, .85);
  border-color: #6a5a38;
  box-shadow: inset 0 0 26px rgba(255, 215, 140, .5);
}

.doorFig {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  transition: opacity .06s;
}

.doorFig.on {
  opacity: 1;
}

.wfig {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.whead {
  position: relative;
  width: 56%;
  height: 68%;
  border-radius: 42% 42% 30% 30%;
  background: linear-gradient(180deg, var(--c), color-mix(in srgb, var(--c) 38%, #000));
}

.weye {
  position: absolute;
  top: 38%;
  width: 15%;
  height: 15%;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 6px #fff, 0 0 13px #fff;
}

.weye.l { left: 20%; }
.weye.r { right: 20%; }

.wear {
  position: absolute;
  top: -38%;
  width: 17%;
  height: 44%;
  background: var(--c);
  border-radius: 40%;
}

.wear.l {
  left: 16%;
  transform: rotate(-8deg);
}

.wear.r {
  right: 16%;
  transform: rotate(8deg);
}

.wbeak {
  position: absolute;
  bottom: 6%;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 9px solid transparent;
  border-right: 9px solid transparent;
  border-top: 11px solid #e8891c;
}

.what {
  position: absolute;
  top: -26%;
  left: 50%;
  transform: translateX(-50%);
  width: 52%;
  height: 26%;
  background: #111;
  border-radius: 3px;
}

.ctrlCol {
  position: absolute;
  display: flex;
  flex-direction: column;
  gap: 9px;
  z-index: 6;
}

#leftCtrls {
  left: 1.5%;
  top: 40%;
}

#rightCtrls {
  right: 1.5%;
  top: 40%;
}

.ctrlCol button {
  width: 112px;
  font-weight: bold;
  padding: 12px 6px;
  font-size: 13px;
  letter-spacing: 1px;
  border-width: 2px;
}

.ctrlCol button.active {
  background: linear-gradient(#4a1818, #2a0a0a);
  border-color: #c44;
  box-shadow: 0 0 14px #f006;
  color: #fdd;
}

.ctrlCol button.jammed {
  background: #300;
  border-color: #f33;
  color: #f77;
  animation: jpulse .5s infinite;
}

@keyframes jpulse {
  50% { opacity: .5; }
}

.ctrlCol button.lock {
  animation: lightFlick .09s steps(2) infinite;
}

@keyframes lightFlick {
  50% { filter: brightness(1.8); }
}

#camArrow {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 2px;
  z-index: 28;
  width: min(470px, 50vw);
  padding: 8px 12px;
  cursor: pointer;
}

#camArrow img {
  width: 100%;
  display: block;
  transition: transform .12s ease;
  filter: drop-shadow(0 0 8px #000);
  image-rendering: pixelated;
}

#camArrow.flip img {
  transform: scaleY(-1);
}

#camArrow:hover img {
  filter: drop-shadow(0 0 14px rgba(255, 255, 255, .6));
}

#monTrans {
  position: absolute;
  inset: 0;
  z-index: 46;
  display: none;
  background: transparent;
  pointer-events: none;
}

#monTrans video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
}

.spriteCam {
  position: absolute;
  top: 50%;
  left: 50%;
  height: 720px;
  width: auto;
  max-width: none;
  transform: translate(-50%, -50%);
  will-change: transform;
  image-rendering: auto;
}

.fig {
  position: relative;
  width: 86px;
  height: 158px;
  filter: drop-shadow(0 6px 14px #000);
  animation: figjit .12s steps(2) infinite;
}

@keyframes figjit {
  50% { transform: translateX(1px); }
}

.fig.sm {
  width: 64px;
  height: 118px;
}

.fig .head {
  position: absolute;
  left: 8px;
  right: 8px;
  top: 0;
  height: 54px;
  border-radius: 26px 26px 14px 14px;
  background: linear-gradient(180deg, var(--c), color-mix(in srgb, var(--c) 45%, #000));
}

.fig .torso {
  position: absolute;
  left: 14px;
  right: 14px;
  top: 46px;
  bottom: 0;
  border-radius: 22px 22px 8px 8px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, #000), #000);
}

.fig .eye {
  position: absolute;
  top: 20px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 7px #fff, 0 0 14px #fff;
}

.fig .eye.l { left: 17px; }
.fig .eye.r { right: 17px; }

.fig .fname {
  position: absolute;
  bottom: -16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: #bbb;
  background: #000a;
  padding: 1px 5px;
  border-radius: 3px;
  white-space: nowrap;
}

.fig .hat {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 30px;
  height: 16px;
  background: #111;
  border-radius: 3px;
}

.fig .hat::after {
  content: '';
  position: absolute;
  bottom: -3px;
  left: -7px;
  width: 44px;
  height: 5px;
  background: #111;
  border-radius: 2px;
}

.fig .ear {
  position: absolute;
  top: -26%;
  width: 13px;
  height: 32px;
  border-radius: 7px;
  background: var(--c);
}

.fig .ear.l {
  left: 16%;
  transform: rotate(-6deg);
}

.fig .ear.r {
  right: 16%;
  transform: rotate(6deg);
}

.fig .beak {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 11px solid transparent;
  border-right: 11px solid transparent;
  border-top: 14px solid #e8891c;
}

.fig .patch {
  position: absolute;
  top: 16px;
  left: 12px;
  width: 14px;
  height: 12px;
  background: #111;
  border-radius: 50%;
}

#hud {
  position: absolute;
  top: 16px;
  right: 20px;
  text-align: right;
  z-index: 30;
  pointer-events: none;
}

#timeLbl {
  font-size: 34px;
  color: #fff;
  text-shadow: 0 0 12px #000, 0 0 30px #fff2;
  font-weight: bold;
  letter-spacing: 2px;
}

#nightLbl {
  font-size: 14px;
  color: #999;
  margin-top: 3px;
}

#powerBox {
  position: absolute;
  left: 20px;
  bottom: 18px;
  z-index: 30;
  pointer-events: none;
}

#powerPct {
  font-size: 28px;
  color: #fff;
  text-shadow: 0 0 10px #000;
  font-weight: bold;
}

.usageBars {
  display: flex;
  gap: 4px;
  margin-top: 7px;
}

.ubar {
  width: 19px;
  height: 28px;
  background: #111;
  border: 2px solid #333;
  border-radius: 2px;
  transition: .2s;
}

.ubar.on1 {
  background: #3f9f4f;
  border-color: #5fc46f;
  box-shadow: 0 0 9px #3f9f4f80;
}

.ubar.on2 {
  background: #9fc434;
  border-color: #c4e454;
  box-shadow: 0 0 9px #9fc43480;
}

.ubar.on3 {
  background: #e09020;
  border-color: #ffb040;
  box-shadow: 0 0 9px #e0902080;
}

.ubar.on4 {
  background: #e03020;
  border-color: #ff5040;
  box-shadow: 0 0 12px #e0302080;
  animation: dangerPulse 1s infinite;
}

@keyframes dangerPulse {
  50% { opacity: .6; }
}

#phoneUI {
  position: absolute;
  left: 20px;
  top: 16px;
  z-index: 32;
  display: none;
  align-items: center;
  gap: 10px;
  background: #000a;
  border: 1px solid #333;
  padding: 8px 12px;
  border-radius: 6px;
}

#phoneUI .icon {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #3a3;
  animation: ring .6s infinite;
}

@keyframes ring {
  0%, 100% { box-shadow: 0 0 4px #3a3; }
  50% { box-shadow: 0 0 16px #5f5; }
}

#phoneUI button {
  padding: 4px 8px;
  font-size: 11px;
}

#camOverlay {
  position: absolute;
  inset: 0;
  background: #000;
  z-index: 25;
  display: none;
}

#camView {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #050505;
}

.scanlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  background: repeating-linear-gradient(0deg, transparent 0 3px, #00000030 3px 4px);
}

.crtFlicker {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  background: #fff;
  opacity: 0;
  animation: crt .1s steps(2) infinite;
}

@keyframes crt {
  50% { opacity: .02; }
}

#staticCv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 3;
  opacity: .35;
  image-rendering: pixelated;
  pointer-events: none;
}

#camTopLeft {
  position: absolute;
  top: 18px;
  left: 22px;
  z-index: 27;
  color: #ddd;
  text-shadow: 0 0 8px #000;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 1px;
}

#rec {
  display: inline-block;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #f00;
  margin-right: 9px;
  box-shadow: 0 0 10px #f00;
  animation: blink 1s steps(2) infinite;
}

@keyframes blink {
  50% { opacity: .15; }
}

#camMap {
  position: absolute;
  right: 20px;
  bottom: 20px;
  z-index: 27;
  background: transparent;
  padding: 0;
  border-radius: 0;
  box-shadow: none;
}

#mapBox {
  position: relative;
  width: min(500px, 48vw);
  aspect-ratio: 900/680;
}

#mapBox svg.plan {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.camBtn {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 13%;
  min-width: 48px;
  background: #3a3d42;
  border: 3px solid #ececec;
  color: #fff;
  font-weight: bold;
  font-size: 11px;
  line-height: 1.15;
  text-align: left;
  padding: 4px 6px;
  letter-spacing: 1px;
  box-shadow: 0 0 0 2px #17181a;
  border-radius: 2px;
}

.camBtn:hover {
  background: #4a4e55;
  transform: translate(-50%, -50%);
}

.camBtn.sel {
  background: #6a1414;
  border-color: #ff5555;
  box-shadow: 0 0 14px #f00a, 0 0 0 2px #17181a;
}

.roomContent {
  position: absolute;
  inset: 0;
  overflow: hidden;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 0;
  z-index: 2;
}

.emptyroom {
  color: #3a3a3a;
  font-size: 26px;
  letter-spacing: 6px;
  text-shadow: 0 0 12px #000;
}

.camnote {
  color: #8fae8f;
  font-size: 15px;
  width: 100%;
  text-align: center;
  text-shadow: 0 0 8px #000;
}

.audioOnly {
  color: #777;
  font-size: 32px;
  letter-spacing: 6px;
  width: 100%;
  text-align: center;
  text-shadow: 0 0 18px #000;
  animation: audioFlick 3s infinite;
}

@keyframes audioFlick {
  50% { opacity: .6; }
}

.poster {
  border: 4px solid #3f3f3f;
  padding: 30px 38px;
  color: #999;
  background: linear-gradient(#161616, #0a0a0a);
  text-align: center;
  box-shadow: 0 0 22px #000a;
  line-height: 1.6;
}

.poster.golden {
  border-color: var(--gold);
  color: var(--gold);
  text-shadow: 0 0 16px var(--gold);
  animation: goldGlow 2s infinite;
}

@keyframes goldGlow {
  50% { box-shadow: 0 0 40px var(--gold); }
}

.prop {
  position: absolute;
  pointer-events: none;
  z-index: 1;
  opacity: .5;
}

.pedestal {
  bottom: 12%;
  width: 60px;
  height: 16px;
  background: #222;
  border-radius: 4px;
}

.table {
  bottom: 18%;
  width: 90px;
  height: 30px;
  background: #1c1c1c;
  border-radius: 6px;
}

.shelf {
  top: 22%;
  width: 140px;
  height: 8px;
  background: #202020;
}

.hallLine {
  bottom: 0;
  width: 2px;
  height: 70%;
  background: linear-gradient(#0000, #333);
}

#goldenOverlay {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: none;
  background: #000d;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  animation: gshake .09s infinite;
}

@keyframes gshake {
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}

.itsme {
  color: var(--gold);
  font-size: 52px;
  letter-spacing: 12px;
  text-shadow: 0 0 30px var(--gold);
  margin-top: 22px;
  font-weight: bold;
  animation: itsmeF .16s steps(2) infinite;
}

@keyframes itsmeF {
  50% { opacity: .2; }
}

#cues {
  position: absolute;
  top: 18px;
  left: 190px;
  z-index: 35;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-width: 320px;
}

.cue {
  background: #000b;
  color: #9fc49f;
  padding: 5px 10px;
  border-left: 3px solid #4a4;
  font-size: 13px;
  border-radius: 3px;
  text-shadow: 0 0 4px #000;
}

#jumpOv {
  position: absolute;
  inset: 0;
  z-index: 80;
  display: none;
  background: #000;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#jumpOv .jfig {
  transform-origin: bottom center;
  animation: lunge .5s ease-out forwards;
}

@keyframes lunge {
  0% { transform: scale(.4) translateY(80px); opacity: .4; }
  60% { transform: scale(2.4) translateY(-10px); opacity: 1; }
  100% { transform: scale(2.7) translateY(-14px); }
}

#flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 81;
}

.introOv {
  position: absolute;
  inset: 0;
  background: #000;
  z-index: 70;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
}

.introNight {
  font-size: 44px;
  letter-spacing: 8px;
  color: #ddd;
  opacity: 0;
  animation: fadeIn 1.2s forwards;
}

.introTime {
  font-size: 22px;
  color: #777;
  letter-spacing: 4px;
  opacity: 0;
  animation: fadeIn 1.2s .8s forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

.pauseOv {
  position: absolute;
  inset: 0;
  background: #000c;
  z-index: 60;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
}

.crashScreen {
  background: #000;
}

#debugBtn {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  font-size: 11px;
  padding: 4px 9px;
  opacity: .5;
}

#debugPanel {
  position: absolute;
  top: 42px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 49;
  background: #000d;
  border: 1px solid var(--line);
  padding: 10px;
  border-radius: 6px;
  font-size: 11px;
  max-width: 92vw;
  display: none;
}

#debugPanel.open {
  display: block;
}

#debugPanel pre {
  color: #8fbf8f;

<script>
"use strict";

// Utility functions
const $ = (selector) => document.querySelector(selector);
const root = $("#root");
const rnd = (min, max) => min + Math.random() * (max - min);
const rint = (min, max) => Math.floor(rnd(min, max + 1));
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

// Asset URLs - grouped by type
const AUDIO_URLS = {
  phone: "https://files.catbox.moe/9hb3et.ogg",
  fan: "https://files.catbox.moe/ucomf0.ogg",
  lights: "https://files.catbox.moe/s6uhhp.ogg",
  monitorOpen: "https://files.catbox.moe/c1fndm.ogg",
  monitorClose: "https://files.catbox.moe/m6fwq8.ogg",
  foxySong: "https://files.catbox.moe/0s8fpt.ogg",
  panSound: "https://files.catbox.moe/qxkrv5.ogg",
  garble: [
    "https://files.catbox.moe/yo5q86.ogg",
    "https://files.catbox.moe/uwho3w.ogg",
    "https://files.catbox.moe/6emy1z.ogg",
    "https://files.catbox.moe/m0ygh2.ogg"
  ]
};

const IMAGE_URLS = {
  arrow: "https://files.catbox.moe/mb2j2r.png",
  office: "https://files.catbox.moe/2mii3u.original",

};

};

const STAGE_SPRITES = {
  all: "https://files.catbox.moe/wiorob.png",
  empty: "https://files.catbox.moe/yz2rew.png",
  fonly: "https://files.catbox.moe/azcr8y.png",
  bgone: "https://files.catbox.moe/v0lamm.png",
  cgone: "https://files.catbox.moe/s3ajrs.png",
  stare: "https://files.catbox.moe/m0b7yp.png"
};

// Constants
const SPRITE_HEIGHT = 720;
const COVE_PAN_SPEED = 0.16;
const COVE_HOLD_DURATION = 2;
const PAN_CHANCE = 0.5;
const PAN_COOLDOWN = 0.6;
const GARBLE_DURATION = 5;

// Image caching system
const imageCache = {};
let preloadPending = 0;
let preloadDone = false;

function preloadImage(url) {
  if (imageCache[url]) return imageCache[url];
  
  const img = new Image();
  imageCache[url] = img;
  preloadPending++;
  
  const onDone = () => {
    preloadPending--;
    if (preloadPending <= 0) {
      preloadDone = true;
      const el = $("#loadStatus");
      if (el) el.textContent = "sprites ready";
    }
  };
  
  img.src = url;
  if (img.decode) {
    img.decode().then(onDone).catch(onDone);
  } else {
    img.onload = onDone;
    img.onerror = onDone;
  }
  return img;
}

function preloadAllImages() {
  [
    IMAGE_URLS.office,
    IMAGE_URLS.arrow,
    ...Object.values(COVE_SPRITES),
    ...Object.values(STAGE_SPRITES)
  ].forEach(preloadImage);
}

// Timing configurations
const TIMINGS = {
  wiki: { H: [0, 90, 179, 268, 357, 446, 535] },
  decomp: { H: [0, 86, 172, 258, 344, 430, 516] }
};
let currentTiming = TIMINGS.wiki;

// Audio system with improved naming and error handling
const AudioSys = {
  ctx: null,
  masterGain: null,
  ambient: [],
  lightHum: null,
  phoneAudio: null,
  fanAudio: null,
  lightsAudio: null,
  songAudio: null,
  ready: false,
  monitorBuffers: { oc: null, ds: null },
  monitorActive: [],
  garbleBuffers: [],
  panBuffer: null,
  
  init() {
    if (this.ready) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.85;
      this.masterGain.connect(this.ctx.destination);
      this.ready = true;
      this.loadMonitorSounds();
      this.loadGarbleSounds();
    } catch (e) {
      console.warn("Audio init failed:", e);
    }
  },
  
  resume() {
    if (this.ctx && this.ctx.state === "suspended") {
      this.ctx.resume();
    }
  },
  
  loadMonitorSounds() {
    if (!this.ready) return;
    
    const loadBuffer = (url, key) => {
      if (this.monitorBuffers[key]) return;
      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error("Failed to fetch");
          return response.arrayBuffer();
        })
        .then(arrayBuffer => this.ctx.decodeAudioData(arrayBuffer))
        .then(buffer => {
          this.monitorBuffers[key] = buffer;
        })
        .catch(() => {});
    };
    
    loadBuffer(AUDIO_URLS.monitorOpen, "oc");
    loadBuffer(AUDIO_URLS.monitorClose, "ds");
  },
  
  loadGarbleSounds() {
    if (!this.ready) return;
    
    AUDIO_URLS.garble.forEach((url, index) => {
      if (this.garbleBuffers[index]) return;
      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error("Failed to fetch");
          return response.arrayBuffer();
        })
        .then(arrayBuffer => this.ctx.decodeAudioData(arrayBuffer))
        .then(buffer => {
          this.garbleBuffers[index] = buffer;
        })
        .catch(() => {});
    });
    
    if (!this.panBuffer) {
      fetch(AUDIO_URLS.panSound)
        .then(response => {
          if (!response.ok) throw new Error("Failed to fetch");
          return response.arrayBuffer();
        })
        .then(arrayBuffer => this.ctx.decodeAudioData(arrayBuffer))
        .then(buffer => {
          this.panBuffer = buffer;
        })
        .catch(() => {});
    }
  },
  
  playGarble() {
    if (!this.ready) return;
    const buffers = this.garbleBuffers.filter(Boolean);
    if (!buffers.length) return;
    
    const source = this.ctx.createBufferSource();
    source.buffer = buffers[rint(0, buffers.length - 1)];
    source.connect(this.masterGain);
    source.start();
  },
  
  playPan() {
    if (this.ready && this.panBuffer) {
      const source = this.ctx.createBufferSource();
      source.buffer = this.panBuffer;
      source.connect(this.masterGain);
      source.start();
    } else {
      const audio = new Audio(AUDIO_URLS.panSound);
      audio.play().catch(() => {});
    }
  },
  
  initSong() {
    if (this.songAudio) return;
    try {
      this.songAudio = new Audio(AUDIO_URLS.foxySong);
      this.songAudio.preload = "auto";
    } catch (e) {}
  },
  
  playSong() {
    if (this.songAudio) {
      try {
        this.songAudio.currentTime = 0;
        this.songAudio.play().catch(() => {});
      } catch (e) {}
    }
  },
  
  playMonitorSound(key, cutMs) {
    const buffer = this.monitorBuffers[key];
    if (this.ready && buffer) {
      const source = this.ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(this.masterGain);
      source.start();
      
      const record = {
        key,
        stop: () => {
          try { source.stop(); } catch (e) {}
        },
        timeoutId: 0
      };
      
      source.onended = () => {
        const idx = this.monitorActive.indexOf(record);
        if (idx >= 0) this.monitorActive.splice(idx, 1);
      };
      
      if (cutMs) {
        record.timeoutId = setTimeout(record.stop, cutMs);
      }
      this.monitorActive.push(record);
    } else {
      const audio = new Audio(key === "oc" ? AUDIO_URLS.monitorOpen : AUDIO_URLS.monitorClose);
      audio.play().catch(() => {});
      if (cutMs) {
        setTimeout(() => {
          try { audio.pause(); } catch (e) {}
        }, cutMs);
      }
    }
  },
  
  stopMonitorSoundByKey(key) {
    this.monitorActive = this.monitorActive.filter(record => {
      if (record.key === key) {
        clearTimeout(record.timeoutId);
        record.stop();
        return false;
      }
      return true;
    });
  },
  
  stopMonitorSounds() {
    this.monitorActive.forEach(record => {
      clearTimeout(record.timeoutId);
      record.stop();
    });
    this.monitorActive = [];
  },
  
  generateNoise(seconds) {
    const sampleRate = this.ctx.sampleRate;
    const length = sampleRate * seconds;
    const buffer = this.ctx.createBuffer(1, length, sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    return buffer;
  },
  
  startAmbient() {
    if (!this.ready) return;
    const ctx = this.ctx;
    const oscillator = ctx.createOscillator();
    oscillator.type = "sine";
    oscillator.frequency.value = 44;
    
    const gain = ctx.createGain();
    gain.gain.value = 0.04;
    oscillator.connect(gain);
    gain.connect(this.masterGain);
    oscillator.start();
    this.ambient = [oscillator];
  },
  
  initFan() {
    this.stopFan();
    try {
      this.fanAudio = new Audio(AUDIO_URLS.fan);
      this.fanAudio.loop = true;
      this.fanAudio.volume = 0.22;
      this.fanAudio.play().catch(() => {});
    } catch (e) {}
  },
  
  setFan(enabled) {
    if (!this.fanAudio) return;
    if (enabled) {
      if (this.fanAudio.paused) this.fanAudio.play().catch(() => {});
    } else {
      if (!this.fanAudio.paused) this.fanAudio.pause();
    }
  },
  
  stopFan() {
    if (this.fanAudio) {
      try { this.fanAudio.pause(); } catch (e) {}
      this.fanAudio = null;
    }
  },
  
  initLights() {
    this.stopLights();
    try {
      this.lightsAudio = new Audio(AUDIO_URLS.lights);
      this.lightsAudio.loop = true;
      this.lightsAudio.volume = 0;
      this.lightsAudio.play().catch(() => {});
    } catch (e) {}
  },
  
  stopLights() {
    if (this.lightsAudio) {
      try { this.lightsAudio.pause(); } catch (e) {}
      this.lightsAudio = null;
    }
  },
  
  stopAll() {
    try {
      this.ambient.forEach(osc => osc.stop());
      this.ambient = [];
      this.humOff();
    } catch (e) {}
    this.stopFan();
    this.stopLights();
    this.stopMonitorSounds();
    if (this.songAudio) {
      try { this.songAudio.pause(); } catch (e) {}
    }
  },
  
  playDoor(close) {
    if (!this.ready) return;
    const ctx = this.ctx;
    const time = ctx.currentTime;
    
    const osc1 = ctx.createOscillator();
    osc1.type = "sine";
    osc1.frequency.setValueAtTime(close ? 110 : 130, time);
    osc1.frequency.exponentialRampToValueAtTime(38, time + 0.14);
    
    const gain1 = ctx.createGain();
    gain1.gain.setValueAtTime(0.5, time);
    gain1.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
    osc1.connect(gain1);
    gain1.connect(this.masterGain);
    osc1.start(time);
    osc1.stop(time + 0.2);
    
    const osc2 = ctx.createOscillator();
    osc2.type = "square";
    osc2.frequency.value = close ? 760 : 560;
    
    const gain2 = ctx.createGain();
    gain2.gain.setValueAtTime(0.07, time);
    gain2.gain.exponentialRampToValueAtTime(0.001, time + 0.09);
    osc2.connect(gain2);
    gain2.connect(this.masterGain);
    osc2.start(time);
    osc2.stop(time + 0.09);
  },
  
  humOn() {
    if (!this.ready || this.lightHum) return;
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.value = 120;
    
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 400;
    
    const gain = ctx.createGain();
    gain.gain.value = 0.03;
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    osc.start();
    this.lightHum = { osc, gain };
  },
  
  humOff() {
    if (this.lightHum) {
      try { this.lightHum.osc.stop(); } catch (e) {}
      this.lightHum = null;
    }
  },
  
  click(high) {
    if (!this.ready) return;
    const ctx = this.ctx;
    const time = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = "square";
    osc.frequency.value = high ? 700 : 380;
    
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.05, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(time);
    osc.stop(time + 0.05);
  },
  
  buzz() {
    if (!this.ready) return;
    const ctx = this.ctx;
    const time = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = "square";
    osc.frequency.value = 90;
    
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.05, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(time);
    osc.stop(time + 0.12);
  },
  
  laugh() {
    if (!this.ready) return;
    const ctx = this.ctx;
    let time = ctx.currentTime;
    for (let i = 0; i < 3; i++) {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(120, time);
      osc.frequency.exponentialRampToValueAtTime(70, time + 0.22);
      
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.18, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.25);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(time);
      osc.stop(time + 0.26);
      time += 0.34;
    }
  },
  
  footstep() {
    if (!this.ready) return;
    const ctx = this.ctx;
    const time = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(70, time);
    osc.frequency.exponentialRampToValueAtTime(40, time + 0.1);
    
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.16, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(time);
    osc.stop(time + 0.12);
  },
  
  jumpscareScream() {
    if (!this.ready) return;
    const ctx = this.ctx;
    const time = ctx.currentTime;
    
    const noise = ctx.createBufferSource();
    noise.buffer = this.generateNoise(1);
    const waveShaper = ctx.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
      const x = i / 128 - 1;
      curve[i] = Math.tanh(x * 6);
    }
    waveShaper.curve = curve;
    
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.6, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.9);
    noise.connect(waveShaper);
    waveShaper.connect(gain);
    gain.connect(this.masterGain);
    noise.start(time);
    
    const osc = ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(700, time);
    osc.frequency.linearRampToValueAtTime(1300, time + 0.08);
    osc.frequency.linearRampToValueAtTime(500, time + 0.6);
    
    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0.3, time);
    oscGain.gain.exponentialRampToValueAtTime(0.001, time + 0.75);
    osc.connect(oscGain);
    oscGain.connect(this.masterGain);
    osc.start(time);
    osc.stop(time + 0.75);
  },
  
  musicBox() {
    if (!this.ready) return 0;
    const ctx = this.ctx;
    let time = ctx.currentTime + 0.1;
    const sequence = [
      [349, 0.4], [349, 0.4], [349, 0.4], [523, 0.8], [494, 0.4], [440, 0.4], [392, 0.4], [349, 0.8],
      [349, 0.4], [349, 0.4], [349, 0.4], [523, 0.8], [587, 0.6], [523, 0.6], [494, 1.2]
    ];
    sequence.forEach(([freq, duration]) => {
      const osc1 = ctx.createOscillator();
      osc1.type = "sine";
      osc1.frequency.value = freq * 2;
      const osc2 = ctx.createOscillator();
      osc2.type = "sine";
      osc2.frequency.value = freq * 4;
      
      const gain1 = ctx.createGain();
      gain1.gain.setValueAtTime(0.13, time);
      gain1.gain.exponentialRampToValueAtTime(0.001, time + duration * 0.9);
      const gain2 = ctx.createGain();
      gain2.gain.setValueAtTime(0.03, time);
      gain2.gain.exponentialRampToValueAtTime(0.001, time + duration * 0.5);
      
      osc1.connect(gain1);
      osc2.connect(gain2);
      gain1.connect(this.masterGain);
      gain2.connect(this.masterGain);
      osc1.start(time);
      osc1.stop(time + duration);
      osc2.start(time);
      osc2.stop(time + duration);
      time += duration;
    });
    return time - ctx.currentTime;
  },
  
  chimes() {
    if (!this.ready) return;
    const ctx = this.ctx;
    const time = ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, index) => {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = freq;
      
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, time + index * 0.32);
      gain.gain.linearRampToValueAtTime(0.22, time + index * 0.32 + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, time + index * 0.32 + 1.6);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(time + index * 0.32);
      osc.stop(time + index * 0.32 + 1.6);
    });
  },
  
  ring() {
    if (!this.ready) return;
    const ctx = this.ctx;
    let time = ctx.currentTime;
    for (let i = 0; i < 2; i++) {
      const osc = ctx.createOscillator();
      osc.type = "square";
      osc.frequency.value = 1400;
      
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.06, time);
      gain.gain.setValueAtTime(0, time + 0.35);
      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start(time);
      osc.stop(time + 0.4);
      time += 0.5;
    }
  },
  
  playPhone() {
    this.stopPhone();
    try {
      this.phoneAudio = new Audio(AUDIO_URLS.phone);
      this.phoneAudio.volume = 0.85;
      this.phoneAudio.play().catch(() => {});
    } catch (e) {}
  },
  
  stopPhone() {
    if (this.phoneAudio) {
      try {
        this.phoneAudio.pause();
        this.phoneAudio.currentTime = 0;
      } catch (e) {}
      this.phoneAudio = null;
    }
  }
};

// Initialize audio on first user interaction
document.addEventListener("click", () => {
  AudioSys.init();
  AudioSys.resume();
  AudioSys.initSong();
  if (AudioSys.lightsAudio && AudioSys.lightsAudio.paused && State.screen === "game") {
    AudioSys.lightsAudio.play().catch(() => {});
  }
  if (AudioSys.fanAudio && AudioSys.fanAudio.paused && State.screen === "game" && State.started && State.monitorState !== "up" && !State.outage) {
    AudioSys.fanAudio.play().catch(() => {});
  }
});

 if(S.monState==="closing")return $("#vidLower"); return null; }

 const vo=$("#vidOpen"),vl=$("#vidLower");
 if(vo)vo.pause(); if(vl)vl.pause();
 const ov=$("#monTrans"); if(ov)ov.style.display="none"; }

 const o=which==="raise"?$("#vidLower"):$("#vidOpen");
 if(o)o.pause();
 const ov=$("#monTrans"); ov.style.display="block";
 if(v)v.style.opacity="1"; if(o)o.style.opacity="0";
 if(!v){ finishTrans(); return; }
 const begin=()=>{ try{ const d=isFinite(v.duration)?v.duration:Infinity;
   v.currentTime=startAt>0?Math.min(startAt,d):0; }catch(e){}
  v.play().catch(()=>{}); };
 if(v.readyState>=1) begin(); else v.addEventListener("loadedmetadata",begin,{once:true});
 clearTimeout(transFallback);
 transFallback=setTimeout(()=>{ if(S.monState==="opening"||S.monState==="closing") finishTrans(); },8000); }
function finishTrans(){ clearTimeout(transFallback); hideTrans();
 if(S.monState==="opening"){ S.monState="up"; S.camStatic=0; AudioSys.monPlay("ds",0); rollStare(); }
 else if(S.monState==="closing"){ S.monState="office"; S.monitorUp=false;

 AudioSys.monStop(); AudioSys.monPlay("oc",0);
 playTrans("raise",at);

 if(S.pendingKill){ triggerJumpscare(S.pendingKill.who,S.pendingKill.who+" got you."); return; }
 const interrupt=(S.monState==="opening");
 const av=activeVid(); const at=(interrupt&&av)?av.currentTime:0;
 if(interrupt&&av)av.pause();
 S.monState="closing"; markAction();

function onAnimMove(from,to){ const cams=new Set();
 const a=ROOM_TO_CAM[from]; if(a)cams.add(a);

function tryPanSound(){ if(S.time-S.lastPanSnd<PAN_COOLDOWN)return;

function updatePan(dt){ const p=S.pan;
 const sprite=(S.monitorUp&&(S.currentCam==="1C"||S.currentCam==="1A"));
 if(p.wait>0){ p.wait-=dt;
  if(p.wait<=0){ p.dir*=-1; if(sprite)tryPanSound(); }
  p.wasCove=sprite; return; }
 if(sprite&&!p.wasCove)tryPanSound();
 p.wasCove=sprite;
 p.x+=p.dir*COVE_PAN_SPEED*dt;
 if(p.x>=1){p.x=1;p.wait=COVE_HOLD;}
 else if(p.x<=-1){p.x=-1;p.wait=COVE_HOLD;} }

function ghtsTarget(){

  let t=0;
  if(["westhall","westcorner","closet","leftdoor"].includes(S.bonnie.loc)) t++;
  if(["easthall","eastcorner","rightdoor"].includes(S.chica.loc)) t++;
  if(S.foxy.stage>=2) t++;

}
function updateGhts(dt){

  const v=AudioSys.ghtsEl.volume;
  AudioSys.ghtsEl.volume=clamp(v+(target-v)*Math.min(1,dt*6),0,1);
}

  if(f.loc==="kitchen")addCue("♪ Toreador tune (Kitchen)");} }

  else{const from=S.freddy.loc;S.freddy.loc="office";S.pendingKill={who:"Freddy"};addCue("Freddy slips into the office...");onAnimMove(from,"office");} } }
function updateFreddy(dt){const f=S.freddy,ai=S.ai[0];if(f.loc==="office"||ai<=0)return;

 f.acc+=dt;if(f.acc<MOVE_T.freddy)return;f.acc=0;if(!roll(ai))return;

 if(b.loc==="leftdoor"){ if(S.leftDoor&&!S.leftJam){const from=b.loc;b.loc="dining";addCue("Bonnie leaves the left door");onAnimMove(from,b.loc);}

  if(["westhall","closet","westcorner","leftdoor"].includes(b.loc))addCue("(footsteps, west)");
  if(b.loc==="westcorner"&&S.night>=4)addCue("(gurgle 2B)");

function updateChica(dt){const c=S.chica,ai=S.ai[2];if(ai<=0)return;c.acc+=dt;if(c.acc<MOVE_T.chica)return;c.acc=0;
 if(!roll(ai))return;
 if(c.loc==="rightdoor"){ if(S.rightDoor&&!S.rightJam){const from=c.loc;c.loc=Math.random()<.5?"dining":"easthall";addCue("Chica leaves the right door");onAnimMove(from,c.loc);}

  if(["kitchen","easthall","eastcorner","rightdoor"].includes(c.loc))addCue("(footsteps, east)");

function updateFoxy(dt){ const fx=S.foxy; if(S.outage)return;
 if(S.night===1&&!S.foxyForce&&(S.time-S.lastAction)>70){ S.foxyForce=true; addCue("(the cove curtain rustles...)"); }
 if(fx.stage===4){ fx.runT-=dt;

  return; }

function calcUsage(){let u=1;if(S.leftDoor)u++;if(S.rightDoor)u++;if(S.leftLight)u++;if(S.rightLight)u++;if(S.monitorUp)u++;return u;}
function updatePower(dt){if(S.outage)return;S.powerAcc+=dt;
 while(S.powerAcc>=1){S.powerAcc-=1;S.power-=Math.min(calcUsage(),4)*.1;
  const hi=HIDDEN[S.night];if(hi){S.hiddenAcc++;if(S.hiddenAcc>=hi){S.hiddenAcc=0;S.power-=.1;}}}

function setLight(s,on){ if(s==="L")S.leftLight=on; else S.rightLight=on; if(!on)S.lightLock[s]=0; }
function toggleLight(s){ if(S.outage||S.monitorUp)return;
 if(s==="L"&&S.leftJam){AudioSys.buzz();return;}
 if(s==="R"&&S.rightJam){AudioSys.buzz();return;}

  if(S.lightLock[s]>0){ AudioSys.buzz(); return; }
  setLight(s,false);

  if(Math.random()<0.1){ S.lightLock[s]=0.5; addCue("(the light flickers...)"); }
 }

function makeFigure(name,small){const key=name.toLowerCase().replace("goldenfreddy","gold");

 if(name==="Foxy")deco='<div class="patch"></div>';
 return `<div class="fig ${small?'sm':''}" style="--c:${col}">
  <div class="head"><div class="eye l"></div><div class="eye r"></div>${deco}</div>
  <div class="torso"></div><div class="fname">${name}</div></div>`;}
function makeWindowFig(name){const key=name.toLowerCase();const col=C[key]||"#888";let deco="";
 if(name==="Bonnie")deco='<div class="wear l"></div><div class="wear r"></div>';
 if(name==="Chica")deco='<div class="wbeak"></div>';
 if(name==="Freddy")deco='<div class="what"></div>';
 if(name==="Foxy")deco='<div class="wpatch"></div>';
 return `<div class="wfig" style="--c:${col}"><div class="whead">${deco}<div class="weye l"></div><div class="weye r"></div></div></div>`;}

 AudioSys.setFan(S.started && !S.outage && !S.paused && S.monState!=="up");
 if(e.arrow){ e.arrow.classList.toggle("flip",S.monitorUp); e.arrow.style.display=dark?"none":"block"; }
 e.camOverlay.style.display=(S.monState==="up")?"block":"none";
 if(S.monState==="up"){e.camName.textContent="CAM "+S.currentCam+" — "+CAMS[S.currentCam].n;
  const garbled=(S.garble[S.currentCam]||0)>0;
  if(garbled||S.camStatic>0){ e.room.innerHTML=""; S.roomSig=""; }
  else { const sig=roomSig(); if(sig!==S.roomSig){ S.roomSig=sig; e.room.innerHTML=camContent(S.currentCam); } }
  const img=e.room.querySelector(".spriteCam");
  if(img){ const cw=e.room.clientWidth||1; const iw=img.clientWidth||cw;
   const panMax=Math.max(0,(iw-cw)/2);
   const px=S.pan.x*panMax;
   img.style.transform=`translate(calc(-50% + ${px.toFixed(1)}px), -50%)`; }
  $("#staticCv").style.opacity= garbled? "1" : (S.camStatic>0?".9":".3");
  document.querySelectorAll(".camBtn").forEach(b=>b.classList.toggle("sel",b.dataset.cam===S.currentCam));}
 e.golden.style.display=S.goldenOffice?"flex":"none";
 e.phone.style.display=S.phoneOn?"flex":"none";
 e.cues.innerHTML=S.cues.map(c=>`<div class="cue">${c.t}</div>`).join("");
 if(e.dbg)e.dbg.textContent=debugText();}
function debugText(){const base=getAIRow(S.night,0);
 return `F:${S.freddy.loc} B:${S.bonnie.loc} C:${S.chica.loc} Foxy:st${S.foxy.stage} atk${S.foxy.attacks} stun${S.foxy.noMove.toFixed(1)}${S.foxy.stage===4?" RUN":""}\nbase[${base.join("/")}] cur[${S.ai.join("/")}] t:${S.time.toFixed(0)}/${T.H[6]}s pw:${S.power.toFixed(1)} garble:${(S.garble[S.currentCam]||0).toFixed(1)} stare:${S.freddyStare?1:0} pan:${S.pan.x.toFixed(2)}${S.pan.wait>0?"(hold)":""} sprites:${preloadDone?"ready":"loading"} ${S.outage?"OUTAGE":""}`;}

function updateGame(dt){ if(S.screen!=="game"||S.paused)return;
 if(!S.started){S.introT+=dt;if(S.introT>2.4){S.started=true;const io=$("#introOv");if(io)io.remove();
   AudioSys.startAmbient();AudioSys.initFan();AudioSys.initGhts();AudioSys.initSong();
   if(S.night===1){setTimeout(()=>{if(S.screen==="game"){AudioSys.ring();S.phoneOn=true;setTimeout(()=>AudioSys.playPhone(),900);renderFrame();}},1500);}}
  renderFrame();return;}
 S.time+=dt;
 if(S.time>=T.H[6]){doWin();return;}
 for(const k in S.garble){ S.garble[k]-=dt; if(S.garble[k]<=0)delete S.garble[k]; }
 if(S.lightLock.L>0)S.lightLock.L-=dt;
 if(S.lightLock.R>0)S.lightLock.R-=dt;
 if(S.outage){updateOutage(dt);if(S.screen==="game")renderFrame();return;}
 updateAISchedule();updatePower(dt);if(S.screen!=="game")return;
 if(S.outage){renderFrame();return;}
 if(S.monState==="up")updatePan(dt);
 updateGolden(dt);if(S.screen!=="game")return;
 updateFreddy(dt);updateBonnie(dt);updateChica(dt);updateFoxy(dt);if(S.screen!=="game")return;
 if(S.camStatic>0)S.camStatic-=dt;
 updateCues(dt);
 S.staticT+=dt;if(S.monState==="up"&&S.staticT>.06){S.staticT=0;drawStatic();}
 renderFrame();}
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,.1);last=now;
 if(S.screen==="game"){updateGame(dt);updateGhts(dt);}
 requestAnimationFrame(loop);}
requestAnimationFrame(loop);

 const g=id=>document.getElementById(id);
 S.el={time:g("timeLbl"),night:g("nightLbl"),power:g("powerPct"),u1:g("u1"),u2:g("u2"),u3:g("u3"),u4:g("u4"),

  lDoor:g("lDoor"),rDoor:g("rDoor"),lLight:g("lLight"),rLight:g("rLight"),
  camOverlay:g("camOverlay"),camName:g("camName"),room:g("room"),arrow:g("camArrow"),
  golden:g("goldenOverlay"),cues:g("cues"),dbg:g("dbg"),phone:g("phoneUI")};
 const vo=g("vidOpen"), vl=g("vidLower");
 vo.addEventListener("ended",()=>{ if(S.monState==="opening") finishTrans(); });
 vl.addEventListener("ended",()=>{ if(S.monState==="closing") finishTrans(); });
 vo.addEventListener("error",()=>{ if(S.monState==="opening") setTimeout(finishTrans,300); });
 vl.addEventListener("error",()=>{ if(S.monState==="closing") setTimeout(finishTrans,300); });
 [vo,vl].forEach(v=>{ const p=v.play(); if(p) p.then(()=>{ v.pause(); try{v.currentTime=0;}catch(e){} }).catch(()=>{}); });
 const cb=g("camBtns");
 CAM_KEYS.forEach(k=>{const b=document.createElement("button");b.className="camBtn";b.dataset.cam=k;
  b.innerHTML="CAM<br>"+k;
  const p=MAP_POS[k]; b.style.left=p[0]+"%"; b.style.top=p[1]+"%";
  b.onclick=()=>{ if(S.outage||S.monState!=="up")return; S.currentCam=k; S.camStatic=.35; S.roomSig=""; markAction();
   AudioSys.monStopKey("ds"); AudioSys.monPlay("ds",0);
   if((S.garble[k]||0)>0)AudioSys.playGarble();
   renderFrame(); };
  cb.appendChild(b);});
 g("lDoor").onclick=()=>toggleDoor("L");g("rDoor").onclick=()=>toggleDoor("R");
 g("lLight").onclick=()=>toggleLight("L");g("rLight").onclick=()=>toggleLight("R");
 const arrow=g("camArrow");
 const arrowToggle=()=>{ if(S.screen!=="game"||!S.started||S.paused||S.outage)return;
  if(S.monState==="office")raiseMonitor();
  else if(S.monState==="up")lowerMonitor();
  else if(S.monState==="opening")lowerMonitor();
  else if(S.monState==="closing")raiseMonitor(); };
 arrow.addEventListener("mouseenter",arrowToggle);
 arrow.addEventListener("click",arrowToggle);
 g("phoneMute").onclick=()=>{AudioSys.stopPhone();S.phoneOn=false;renderFrame();};
 g("debugBtn").onclick=()=>g("debugPanel").classList.toggle("open");
 document.querySelectorAll("#debugPanel [data-d]").forEach(b=>b.onclick=()=>{const d=b.dataset.d;
  if(d==="hour")S.time=Math.min(S.time+T.H[1],T.H[6]-1);if(d==="pw")S.power=50;
  if(d==="fb"){S.freddy.loc="eastcorner";S.ai[0]=Math.max(S.ai[0],1);}
  if(d==="bl"){S.bonnie.loc="leftdoor";S.ai[1]=Math.max(S.ai[1],1);}
  if(d==="cr"){S.chica.loc="rightdoor";S.ai[2]=Math.max(S.ai[2],1);}
  if(d==="fr")startFoxyRun();if(d==="out"){S.power=0;}if(d==="unlock"){S.unlocked=7;saveProg();}

 g("resumeBtn").onclick=()=>{S.paused=false;g("pauseOv").style.display="none";};

function buildJumpscare(who,reason){const jo=$("#jumpOv");const jf=$("#jfig");
 jf.innerHTML=makeFigure(who==="GoldenFreddy"?"GoldenFreddy":who,false);jo.style.display="flex";
 const fl=$("#flash");fl.style.transition="none";fl.style.opacity=".8";
 setTimeout(()=>{fl.style.transition="opacity .4s";fl.style.opacity="0";},60);
 $("#gameRoot").classList.add("shake");
 setTimeout(()=>{$("#gameRoot").classList.remove("shake");},500);
 setTimeout(()=>{jo.style.display="none";
  if(who==="GoldenFreddy")buildOver(reason,true);else buildOver(reason,false);},950);}

function startGame(n){freshState();S.night=n;S.screen="game";
 if(n===4)S.night4Freddy=rint(1,2);
 if(n===7&&S.customAI.join("/")==="1/9/8/7"){buildGameDOM();renderFrame();triggerJumpscare("GoldenFreddy","CRASH");return;}
 updateAISchedule();buildGameDOM();
 AudioSys.init();AudioSys.resume();AudioSys.monLoad();AudioSys.garbleLoad();AudioSys.initSong();preloadAllImages();
 renderFrame();}

function showTitle(){S.screen="title";AudioSys.stopPhone();AudioSys.stopFan();AudioSys.stopLights();
 preloadAllImages();
 root.innerHTML=`<div class="screen"><h1>FIVE NIGHTS</h1><div class="sub">survival sim — fan mechanics demo</div>
  <div class="menu"><button id="cont">Continue (Night ${Math.min(S.unlocked,7)})</button>
  <button id="newg">New Game</button><button id="nsel">Night Select</button>
  <button id="cust">Custom Night</button><button id="instr">Instructions</button></div>
  <div class="small" id="loadStatus">${preloadDone?"sprites ready":"loading sprites…"}</div></div>`;
 $("#cont").onclick=()=>startGame(Math.min(S.unlocked,7));
 $("#newg").onclick=()=>{S.unlocked=1;saveProg();startGame(1);};
 $("#nsel").onclick=showNightSelect;$("#cust").onclick=showCustom;$("#instr").onclick=showInstructions;}
function showNightSelect(){S.screen="select";let b="";
 for(let i=1;i<=6;i++){const u=i<=S.unlocked;b+=`<button data-n="${i}" ${u?"":"disabled"}>Night ${i}${u?"":" 🔒"}</button>`;}
 const u7=7<=S.unlocked;b+=`<button data-n="7" ${u7?"":"disabled"}>Custom${u7?"":" 🔒"}</button>`;
 root.innerHTML=`<div class="screen"><h1>NIGHT SELECT</h1><div class="grid">${b}</div><button id="back">Back</button></div>`;
 root.querySelectorAll("[data-n]").forEach(x=>x.onclick=()=>startGame(+x.dataset.n));$("#back").onclick=showTitle;}

 names.forEach((nm,i)=>{sl+=`<div style="display:flex;gap:10px;align-items:center;margin:6px 0">
  <span style="width:80px">${nm}</span><input type="range" min="0" max="20" value="${S.customAI[i]}" data-i="${i}"><b class="val">${S.customAI[i]}</b></div>`;});
 root.innerHTML=`<div class="screen"><h1>CUSTOM NIGHT</h1><div class="card">${sl}
  <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
   <button data-p="0/0/0/0">0/0/0/0</button><button data-p="1/3/3/1">1/3/3/1</button>
   <button data-p="20/20/20/20">20/20/20/20</button><button data-p="1/9/8/7" style="color:#f66">1/9/8/7 ⚠</button></div></div>
  <button id="startc">Start Custom Night</button><button id="backc">Back</button></div>`;
 root.querySelectorAll("input[type=range]").forEach(r=>r.oninput=()=>{S.customAI[+r.dataset.i]=+r.value;r.parentElement.querySelector(".val").textContent=r.value;});
 root.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>{const v=x.dataset.p.split("/").map(Number);S.customAI=v;
  root.querySelectorAll("input[type=range]").forEach((r,i)=>{r.value=v[i];r.parentElement.querySelector(".val").textContent=v[i];});});
 $("#startc").onclick=()=>startGame(7);$("#backc").onclick=showTitle;}
function showInstructions(){S.screen="instr";
 root.innerHTML=`<div class="screen"><h1>HOW TO SURVIVE</h1><div class="card">
  <b>Goal:</b> survive 12AM–6AM. Doors, lights, cameras all drain power.<br>
  <b>Monitor:</b> hover the arrow. Opening it kills your hall lights. You can flip mid-animation.<br>
  <b>Lights:</b> only one light at a time; 10% chance a light flickers and won't switch off for 0.5s.<br>
  <b>View Disturbed:</b> when an animatronic moves, the cam it left AND the cam it entered garble for 5s.<br>
  <b>Timing:</b> wiki 535s or decomp 516s — toggle in DEBUG.<br><br>
  <b>Bonnie</b> roams the left side — flash the left light, shut the left door.<br>
  <b>Chica</b> roams the right side — flash the right light, shut the right door.<br>
  <b>Foxy</b> hides in Pirate Cove. ANY camera stalls him; quick monitor flips re-roll his stun. At an empty cove, checking CAM 2A makes him sprint — shut the left door. His knocks drain 1/6/11...%.<br>
  <b>Freddy</b> is camera-shy. When he reaches CAM 4B, keep watching 4B to freeze him; if you look away, close the right door.<br>
  <b>Golden Freddy:</b> if the CAM 2B poster turns golden, raise the monitor FAST.<br><br>
  <b>Door windows:</b> close a door, then hit the light — you'll see who's outside through the door's window.<br>
  <b>Jammed doors</b> stay open — you die the next time you lower the monitor.<br>
  If power hits 0, Freddy plays his song in the dark. Only 6AM saves you.</div>
  <button id="backi">Back</button></div>`;$("#backi").onclick=showTitle;}

  <div class="menu"><button id="cn">Custom Night</button><button id="ts2">Title</button></div></div>`;

function showPinkSlip(){S.screen="pink";
 root.innerHTML=`<div class="screen" style="background:#2a1216"><div class="card" style="background:#e8b4bc;color:#40121a;border:none">
  <h2>NOTICE OF TERMINATION</h2><p>Reasons cited: tampering with the animatronics, general unprofessionalism, and odor.</p>

function buildOver(reason,isCrash){S.screen="over";
 if(isCrash){root.innerHTML=`<div class="screen crashScreen"><div class="itsme">IT'S ME</div>
  <h1 style="color:#f44">CRASH</h1><div class="sub">Golden Freddy</div>
  <div class="menu"><button id="rt">Title</button></div></div>`;}
 else{root.innerHTML=`<div class="screen"><h1 style="color:#f44;text-shadow:0 0 20px #f00">GAME OVER</h1>
  <div class="sub">${reason}</div>
  <div class="menu"><button id="rt2">Retry Night ${S.night}</button><button id="rt3">Title</button></div></div>`;
  $("#rt2").onclick=()=>startGame(S.night);}
 ($("#rt")||$("#rt3")).onclick=showTitle;}

preloadAllImages();
freshState();showTitle();
</script>
