<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Five Nights at Freddy's - Fan Remake</title>
<style>
    /* --- CSS STYLES --- */
    body {
        margin: 0;
        padding: 0;
        background-color: #000;
        color: #fff;
        font-family: 'Courier New', Courier, monospace;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
    }

    #game-container {
        position: relative;
        width: 1024px;
        height: 768px;
        margin: 0 auto;
        background: #111;
        overflow: hidden;
        border: 2px solid #333;
    }

    /* Office Background */
    #office-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        z-index: 1;
        transition: filter 0.2s;
    }

    /* Doors */
    .door {
        position: absolute;
        top: 15%;
        width: 120px;
        height: 70%;
        background: repeating-linear-gradient(45deg, #333, #333 10px, #222 10px, #222 20px);
        border: 4px solid #555;
        z-index: 2;
        transition: transform 0.3s ease-in-out;
        box-shadow: inset 0 0 20px #000;
    }

    #door-left {
        left: 20px;
        transform: translateY(-100%);
    }

    #door-right {
        right: 20px;
        transform: translateY(-100%);
    }

    .door.closed {
        transform: translateY(0);
    }

    /* Door Controls */
    .controls {
        position: absolute;
        top: 40%;
        width: 60px;
        height: 120px;
        background: #222;
        border: 2px solid #444;
        z-index: 3;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        align-items: center;
        padding: 10px 0;
        box-shadow: 0 0 10px rgba(0,0,0,0.8);
    }

    #controls-left { left: 150px; }
    #controls-right { right: 150px; }

    .btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid #000;
        cursor: pointer;
        box-shadow: 0 4px 5px rgba(0,0,0,0.5);
        transition: all 0.1s;
        font-weight: bold;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .btn-door { background: #a33; color: #fff; }
    .btn-door.active { background: #f55; box-shadow: 0 0 10px #f55; }
    
    .btn-light { background: #dd8; color: #332; }
    .btn-light.active { background: #ffea; box-shadow: 0 0 15px #ffea; }

    /* Light Effects */
    .light-beam {
        position: absolute;
        top: 0;
        width: 300px;
        height: 100%;
        background: radial-gradient(circle at center, rgba(255, 255, 200, 0.4) 0%, rgba(0,0,0,0) 70%);
        z-index: 2;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.1s;
    }

    #light-beam-left { left: 20px; transform-origin: top left; }
    #light-beam-right { right: 20px; transform-origin: top right; transform: scaleX(-1); }

    .light-on { opacity: 1 !important; }

    /* Animatronics in Doorway */
    .monster-door {
        position: absolute;
        top: 20%;
        width: 100px;
        height: 200px;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        z-index: 1;
        display: none;
    }
    #monster-left { left: 40px; }
    #monster-right { right: 40px; }

    /* Camera Monitor */
    #monitor-btn {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        height: 40px;
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid #fff;
        color: #fff;
        text-align: center;
        line-height: 40px;
        font-size: 18px;
        cursor: pointer;
        z-index: 10;
        border-radius: 5px;
        transition: background 0.2s;
    }
    #monitor-btn:hover { background: rgba(255, 255, 255, 0.4); }

    #camera-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 20;
        display: none;
        flex-direction: column;
    }

    #cam-feed {
        flex: 1;
        position: relative;
        background: #111;
        overflow: hidden;
        border: 10px solid #333;
        margin: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #cam-image {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        filter: contrast(1.2) brightness(0.8) sepia(0.3);
    }

    /* Static Noise Overlay */
    .static-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noise)" opacity="0.4"/%3E%3C/svg%3E');
        opacity: 0.15;
        pointer-events: none;
        animation: staticAnim 0.2s infinite;
    }

    @keyframes staticAnim {
        0% { transform: translate(0,0); }
        100% { transform: translate(-10px, -10px); }
    }

    /* Camera Map */
    #cam-map {
        position: absolute;
        bottom: 80px;
        right: 40px;
        width: 200px;
        height: 150px;
        background: rgba(0, 20, 0, 0.8);
        border: 2px solid #0f0;
        z-index: 30;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 5px;
        padding: 10px;
    }

    .cam-btn {
        background: #030;
        border: 1px solid #0f0;
        color: #0f0;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .cam-btn.active { background: #0f0; color: #000; }
    .cam-btn.disabled { opacity: 0.3; pointer-events: none; }

    /* HUD */
    #hud {
        position: absolute;
        bottom: 20px;
        left: 20px;
        z-index: 15;
        font-size: 20px;
        text-shadow: 1px 1px 2px #000;
        pointer-events: none;
    }

    #power-meter {
        position: absolute;
        bottom: 20px;
        right: 20px;
        z-index: 15;
        text-align: right;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 1px 1px 2px #000;
    }

    #usage-bar {
        display: inline-block;
        width: 100px;
        height: 20px;
        background: #333;
        border: 1px solid #fff;
        margin-left: 10px;
        vertical-align: middle;
        position: relative;
    }

    #usage-fill {
        height: 100%;
        background: #0f0;
        width: 0%;
        transition: width 0.5s, background 0.5s;
    }

    /* Jumpscare */
    #jumpscare {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
    }

    #jumpscare-img {
        max-width: 90%;
        max-height: 90%;
        animation: shake 0.1s infinite;
    }

    @keyframes shake {
        0% { transform: translate(0,0) scale(1); }
        25% { transform: translate(-10px, 10px) scale(1.1); }
        50% { transform: translate(10px, -10px) scale(1); }
        75% { transform: translate(-10px, -10px) scale(1.1); }
        100% { transform: translate(0,0) scale(1); }
    }

    /* Game Over / Win Screen */
    #end-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 101;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    #end-title { font-size: 48px; margin-bottom: 20px; color: #f00; }
    #end-msg { font-size: 24px; margin-bottom: 40px; color: #fff; }
    #restart-btn {
        padding: 15px 30px;
        font-size: 20px;
        background: #333;
        color: #fff;
        border: 2px solid #fff;
        cursor: pointer;
        font-family: inherit;
    }
    #restart-btn:hover { background: #555; }

    /* Title Screen */
    #title-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }
    #title-text { font-size: 60px; color: #fff; text-shadow: 0 0 10px #f00; margin-bottom: 20px; }
    #start-prompt { font-size: 24px; color: #aaa; animation: blink 1s infinite; }

    @keyframes blink { 50% { opacity: 0; } }

    /* Phone Guy Overlay */
    #phone-guy {
        position: absolute;
        bottom: 80px;
        left: 20px;
        width: 150px;
        height: 150px;
        background: radial-gradient(circle, rgba(50,50,50,0.9), rgba(0,0,0,0));
        border-radius: 50%;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #ccc;
        text-align: center;
        border: 2px dashed #555;
    }
    #phone-icon { font-size: 40px; color: #0f0; animation: ring 0.5s infinite; }
    @keyframes ring { 0% { transform: rotate(0); } 25% { transform: rotate(10deg); } 75% { transform: rotate(-10deg); } 100% { transform: rotate(0); } }

    /* Debug Panel */
    #debug-panel {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0,0,0,0.7);
        border: 1px solid #555;
        padding: 10px;
        font-size: 12px;
        color: #0f0;
        z-index: 300;
        display: none;
        font-family: monospace;
        pointer-events: none;
    }
</style>
</head>
<body>

<div id="game-container">
    <!-- Title Screen -->
    <div id="title-screen">
        <div id="title-text">FIVE NIGHTS</div>
        <div id="start-prompt">CLICK TO START</div>
    </div>

    <!-- Office -->
    <div id="office-bg"></div>
    
    <!-- Left Side -->
    <div id="door-left" class="door"></div>
    <div id="light-beam-left" class="light-beam"></div>
    <div id="monster-left" class="monster-door"></div>
    <div id="controls-left" class="controls">
        <div class="btn btn-door" id="btn-door-left">DOOR</div>
        <div class="btn btn-light" id="btn-light-left">LIGHT</div>
    </div>

    <!-- Right Side -->
    <div id="door-right" class="door"></div>
    <div id="light-beam-right" class="light-beam"></div>
    <div id="monster-right" class="monster-door"></div>
    <div id="controls-right" class="controls">
        <div class="btn btn-door" id="btn-door-right">DOOR</div>
        <div class="btn btn-light" id="btn-light-right">LIGHT</div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div>Night <span id="night-display">1</span></div>
        <div id="time-display">12 AM</div>
    </div>
    <div id="power-meter">
        <div>Power: <span id="power-val">100</span>%</div>
        <div id="usage-bar"><div id="usage-fill"></div></div>
        <div style="font-size: 14px; margin-top:5px;">Usage: <span id="usage-val">1</span></div>
    </div>

    <!-- Monitor Button -->
    <div id="monitor-btn">OPEN MONITOR</div>

    <!-- Camera System -->
    <div id="camera-screen">
        <div class="static-overlay"></div>
        <div id="cam-feed">
            <img id="cam-image" src="" alt="Camera Feed">
            <div id="cam-name" style="position:absolute; top:20px; left:20px; color:#0f0; font-size:20px; text-shadow:1px 1px 0 #000;">CAM 1A</div>
        </div>
        <div id="cam-map">
            <!-- Generated by JS -->
        </div>
        <div style="position:absolute; bottom:20px; left:20px; color:#fff; font-size:14px;">
            <button class="btn" style="width:100px; height:30px; border-radius:0;" id="toggle-map-btn">TOGGLE MAP</button>
        </div>
    </div>

    <!-- Phone Guy -->
    <div id="phone-guy">
        <div id="phone-icon">📞</div>
        <div id="phone-text">Hello? Hello hello?</div>
    </div>

    <!-- Jumpscare -->
    <div id="jumpscare">
        <img id="jumpscare-img" src="" alt="Jumpscare">
    </div>

    <!-- End Screen -->
    <div id="end-screen">
        <div id="end-title">GAME OVER</div>
        <div id="end-msg">You survived until 6 AM!</div>
        <button id="restart-btn">MAIN MENU</button>
    </div>

    <!-- Debug -->
    <div id="debug-panel"></div>
</div>

<script>
/**
 * FNAF Fan Remake - Cleaned & Optimized Code
 * Features: 7 Nights, 4 Animatronics, Power Mgmt, Audio, Cameras
 */

// --- CONSTANTS & CONFIGURATION ---

const DIFFICULTY_SETTINGS = [
    // Night 1
    { freddy: 3, bonnie: 3, chica: 3, foxy: 2, max_active: 3 },
    // Night 2
    { freddy: 4, bonnie: 4, chica: 4, foxy: 3, max_active: 4 },
    // Night 3
    { freddy: 5, bonnie: 5, chica: 5, foxy: 4, max_active: 5 },
    // Night 4
    { freddy: 6, bonnie: 6, chica: 6, foxy: 5, max_active: 6 },
    // Night 5
    { freddy: 7, bonnie: 7, chica: 7, foxy: 6, max_active: 7 },
    // Night 6 (20/20/20/20)
    { freddy: 20, bonnie: 20, chica: 20, foxy: 20, max_active: 20 },
    // Night 7 (Custom Nightmare)
    { freddy: 25, bonnie: 25, chica: 25, foxy: 25, max_active: 25 }
];

const CAMERAS = [
    { id: '1A', name: 'Show Stage', x: 1, y: 1 },
    { id: '1B', name: 'Dining Area', x: 2, y: 1 },
    { id: '1C', name: 'Pirate Cove', x: 3, y: 1 },
    { id: '2A', name: 'W. Hall', x: 1, y: 2 },
    { id: '2B', name: 'W. Hall Corner', x: 0, y: 2 }, // Left Door view
    { id: '3A', name: 'E. Hall', x: 3, y: 2 },
    { id: '3B', name: 'E. Hall Corner', x: 4, y: 2 }, // Right Door view
    { id: '4A', name: 'Kitchen', x: 2, y: 3 },
    { id: '5', name: 'Parts & Service', x: 2, y: 0 },
    { id: '6', name: 'Freddie Fazbear Head', x: 0, y: 0 }, // Easter egg
    { id: '7', name: 'Hidden Room', x: 4, y: 0 }
];

// Placeholder colors for cameras since we don't have external assets
const CAM_COLORS = {
    '1A': '#322', '1B': '#223', '1C': '#322', 
    '2A': '#222', '2B': '#111', 
    '3A': '#222', '3B': '#111', 
    '4A': '#332', '5': '#211', '6': '#000', '7': '#101'
};

// --- AUDIO SYSTEM ---

const AudioSys = {
    ctx: null,
    masterGain: null,
    monitorBuffers: {},
    garbleBuffers: [],
    isMuted: false,

    init: function() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        this.ctx = new AudioContext();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.5;
        this.masterGain.connect(this.ctx.destination);
        this.generateSounds();
    },

    generateSounds: function() {
        if (!this.ctx) return;
        
        // Generate static/garble sounds procedurally
        const createNoise = (type) => {
            const bufferSize = this.ctx.sampleRate * 2; // 2 seconds
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            return buffer;
        };

        this.garbleBuffers.push(createNoise());
        
        // Simple beep for buttons
        const beepBuf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.1, this.ctx.sampleRate);
        const beepData = beepBuf.getChannelData(0);
        for(let i=0; i<beepBuf.length; i++) beepData[i] = Math.sin(i * 0.5) * (1 - i/beepBuf.length);
        this.monitorBuffers['click'] = beepBuf;

        // Static noise for camera toggle
        this.monitorBuffers['static'] = createNoise();
    },

    playSound: function(bufferName, type = 'one-shot') {
        if (!this.ctx || this.isMuted) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const source = this.ctx.createBufferSource();
        let buffer = this.monitorBuffers[bufferName];
        
        if (!buffer && bufferName === 'garble') {
            buffer = this.garbleBuffers[Math.floor(Math.random() * this.garbleBuffers.length)];
        }

        if (!buffer) return;

        source.buffer = buffer;
        const gain = this.ctx.createGain();
        
        if (type === 'one-shot') {
            source.connect(gain);
            gain.connect(this.masterGain);
            gain.gain.value = 0.1;
            source.start(0);
        } else if (type === 'loop') {
            source.loop = true;
            source.connect(gain);
            gain.connect(this.masterGain);
            gain.gain.value = 0.05;
            source.start(0);
            return source; // Return source to stop later
        }
    },

    playGarble: function() {
        this.playSound('garble', 'one-shot');
    },

    resume: function() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }
};

// --- GAME STATE ---

const Game = {
    night: 1,
    hour: 0, // 0 = 12AM, 6 = 6AM
    power: 100,
    usage: 1,
    isRunning: false,
    isMonitorOpen: false,
    currentCam: '1A',
    
    // Doors & Lights
    leftDoorClosed: false,
    rightDoorClosed: false,
    leftLightOn: false,
    rightLightOn: false,

    // Animatronics State
    animatronics: {
        freddy: { location: '1A', level: 0, moveTimer: 0 },
        bonnie: { location: '1A', level: 0, moveTimer: 0 },
        chica: { location: '1A', level: 0, moveTimer: 0 },
        foxy: { location: '1C', level: 0, stage: 0, moveTimer: 0 }
    },

    // Timers
    aiTimer: 0,
    powerTimer: 0,
    gameLoopId: null,
    secondCounter: 0
};

// --- DOM ELEMENTS CACHE ---

const UI = {};

function cacheElements() {
    UI.officeBg = document.getElementById('office-bg');
    UI.doorLeft = document.getElementById('door-left');
    UI.doorRight = document.getElementById('door-right');
    UI.lightLeft = document.getElementById('light-beam-left');
    UI.lightRight = document.getElementById('light-beam-right');
    UI.monsterLeft = document.getElementById('monster-left');
    UI.monsterRight = document.getElementById('monster-right');
    
    UI.btnDoorLeft = document.getElementById('btn-door-left');
    UI.btnDoorRight = document.getElementById('btn-door-right');
    UI.btnLightLeft = document.getElementById('btn-light-left');
    UI.btnLightRight = document.getElementById('btn-light-right');
    
    UI.powerVal = document.getElementById('power-val');
    UI.usageFill = document.getElementById('usage-fill');
    UI.usageVal = document.getElementById('usage-val');
    UI.timeDisplay = document.getElementById('time-display');
    UI.nightDisplay = document.getElementById('night-display');
    
    UI.monitorBtn = document.getElementById('monitor-btn');
    UI.cameraScreen = document.getElementById('camera-screen');
    UI.camImage = document.getElementById('cam-image');
    UI.camName = document.getElementById('cam-name');
    UI.camMap = document.getElementById('cam-map');
    
    UI.jumpscare = document.getElementById('jumpscare');
    UI.jumpscareImg = document.getElementById('jumpscare-img');
    UI.endScreen = document.getElementById('end-screen');
    UI.endTitle = document.getElementById('end-title');
    UI.endMsg = document.getElementById('end-msg');
    UI.titleScreen = document.getElementById('title-screen');
    UI.phoneGuy = document.getElementById('phone-guy');
    UI.debugPanel = document.getElementById('debug-panel');
}

// --- INITIALIZATION ---

function init() {
    cacheElements();
    setupCameraMap();
    setupEventListeners();
    
    // Show title screen initially
    UI.titleScreen.style.display = 'flex';
}

function setupCameraMap() {
    UI.camMap.innerHTML = '';
    CAMERAS.forEach(cam => {
        const btn = document.createElement('div');
        btn.className = 'cam-btn';
        btn.textContent = cam.id;
        btn.dataset.id = cam.id;
        btn.onclick = () => switchCamera(cam.id);
        UI.camMap.appendChild(btn);
    });
}

function setupEventListeners() {
    // Title Screen
    UI.titleScreen.addEventListener('click', () => {
        AudioSys.init();
        AudioSys.resume();
        startGame();
    });

    // Restart Button
    document.getElementById('restart-btn').addEventListener('click', () => {
        UI.endScreen.style.display = 'none';
        UI.titleScreen.style.display = 'flex';
    });

    // Monitor Toggle
    UI.monitorBtn.addEventListener('click', toggleMonitor);
    document.getElementById('toggle-map-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        UI.camMap.style.display = UI.camMap.style.display === 'none' ? 'grid' : 'none';
    });

    // Door/Light Buttons
    UI.btnDoorLeft.addEventListener('click', () => toggleDoor('left'));
    UI.btnDoorRight.addEventListener('click', () => toggleDoor('right'));
    UI.btnLightLeft.addEventListener('click', () => toggleLight('left'));
    UI.btnLightRight.addEventListener('click', () => toggleLight('right'));

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
        if (!Game.isRunning) return;
        if (e.key === ' ') toggleMonitor();
        if (e.key === 'q') toggleDoor('left');
        if (e.key === 'p') toggleDoor('right');
        if (e.key === 'w') toggleLight('left');
        if (e.key === 'o') toggleLight('right');
        if (e.key === 'd') {
            UI.debugPanel.style.display = UI.debugPanel.style.display === 'none' ? 'block' : 'none';
        }
    });
}

// --- GAME LOGIC ---

function startGame() {
    UI.titleScreen.style.display = 'none';
    UI.endScreen.style.display = 'none';
    UI.jumpscare.style.display = 'none';
    
    // Reset State
    Game.night = Math.min(Game.night, 7);
    Game.hour = 0;
    Game.power = 100;
    Game.usage = 1;
    Game.isRunning = true;
    Game.isMonitorOpen = false;
    Game.currentCam = '1A';
    Game.leftDoorClosed = false;
    Game.rightDoorClosed = false;
    Game.leftLightOn = false;
    Game.rightLightOn = false;
    Game.secondCounter = 0;
    Game.aiTimer = 0;
    Game.powerTimer = 0;

    // Reset Animatronics
    const settings = DIFFICULTY_SETTINGS[Game.night - 1];
    Game.animatronics.freddy = { location: '1A', level: settings.freddy, moveTimer: 0 };
    Game.animatronics.bonnie = { location: '1A', level: settings.bonnie, moveTimer: 0 };
    Game.animatronics.chica = { location: '1A', level: settings.chica, moveTimer: 0 };
    Game.animatronics.foxy = { location: '1C', level: settings.foxy, stage: 0, moveTimer: 0 };

    updateOfficeVisuals();
    updateHUD();
    renderCamera();
    
    // Start Loop
    if (Game.gameLoopId) cancelAnimationFrame(Game.gameLoopId);
    gameLoop();

    // Play Phone Call (Simulated)
    setTimeout(() => {
        if(Game.isRunning) showPhoneCall("Night " + Game.night);
    }, 2000);
}

function gameLoop() {
    if (!Game.isRunning) return;

    // Time Progression (1 hour every ~45 seconds real time)
    Game.secondCounter++;
    if (Game.secondCounter % 60 === 0) { // Approximate seconds
        Game.hour = (Game.hour + 1) % 12;
        if (Game.hour === 0) Game.hour = 12; // Fix 0 to 12 for display
        
        updateTimeDisplay();
        
        if (Game.hour === 6) {
            winGame();
            return;
        }
        
        // Increase difficulty slightly as night progresses
        increaseDifficulty();
    }

    // AI Logic (Run every few frames)
    Game.aiTimer++;
    if (Game.aiTimer > 100) { // Adjust speed based on FPS
        updateAI();
        Game.aiTimer = 0;
    }

    // Power Drain
    Game.powerTimer++;
    if (Game.powerTimer > 60) { // Drain every second approx
        drainPower();
        Game.powerTimer = 0;
    }

    // Foxy Logic (Special case)
    updateFoxy();

    // Render
    if (Game.isMonitorOpen) {
        renderCamera();
    } else {
        checkDoorThreats();
    }

    updateDebug();

    Game.gameLoopId = requestAnimationFrame(gameLoop);
}

function increaseDifficulty() {
    // Optional: Ramp up AI levels mid-night
    const ramp = Math.floor(Game.hour / 2);
    Object.keys(Game.animatronics).forEach(key => {
        if (key !== 'foxy') {
            Game.animatronics[key].level = Math.min(20, DIFFICULTY_SETTINGS[Game.night-1][key] + ramp);
        }
    });
}

function updateAI() {
    const settings = DIFFICULTY_SETTINGS[Game.night - 1];
    
    // Bonnie
    if (Math.random() * 20 < settings.bonnie) moveAnimatronic('bonnie', ['1A', '1B', '2A', '2B', 'office-left']);
    
    // Chica
    if (Math.random() * 20 < settings.chica) moveAnimatronic('chica', ['1A', '1B', '3A', '3B', 'office-right']);
    
    // Freddy
    if (Math.random() * 20 < settings.freddy) moveAnimatronic('freddy', ['1A', '1B', '3A', '4A', 'office-right']);
    
    // Foxy handled separately
}

function moveAnimatronic(name, path) {
    const anim = Game.animatronics[name];
    const currentIdx = path.indexOf(anim.location);
    
    if (currentIdx === -1) {
        // Reset if lost
        anim.location = '1A';
        return;
    }

    // Move forward
    if (currentIdx < path.length - 1) {
        anim.location = path[currentIdx + 1];
        
        // If entering office doorway
        if (anim.location.includes('office')) {
            // Check if door is closed
            const side = anim.location.includes('left') ? 'left' : 'right';
            if ((side === 'left' && Game.leftDoorClosed) || (side === 'right' && Game.rightDoorClosed)) {
                // Blocked, return to start of hall
                anim.location = path[1]; 
                AudioSys.playSound('thud', 'one-shot'); // Placeholder sound logic
            } else {
                // Enter office (Kill player eventually)
                // For now, they just hang out in the door until light checked
            }
        }
    } else {
        // At office, chance to attack
        if (Math.random() < 0.3) {
            triggerJumpscare(name);
        } else {
            // Retreat
            anim.location = '1A';
        }
    }
}

function updateFoxy() {
    const foxy = Game.animatronics.foxy;
    
    // Foxy moves when not looked at
    if (Game.isMonitorOpen && Game.currentCam === '1C') {
        foxy.moveTimer = 0; // Reset if watching
    } else {
        foxy.moveTimer++;
        if (foxy.moveTimer > (200 - foxy.level * 5)) {
            foxy.stage++;
            foxy.moveTimer = 0;
            if (foxy.stage > 3) {
                // Attack!
                if (!Game.leftDoorClosed) {
                    triggerJumpscare('foxy');
                } else {
                    // Blocked by door
                    foxy.stage = 0;
                    foxy.location = '1C';
                    AudioSys.playSound('bang', 'one-shot');
                    drainPower(5); // Penalty for banging
                }
            }
        }
    }
}

function checkDoorThreats() {
    // Check Left Door
    if (Game.animatronics.bonnie.location === 'office-left') {
        UI.monsterLeft.style.backgroundImage = getMonsterSprite('bonnie');
        UI.monsterLeft.style.display = 'block';
    } else {
        UI.monsterLeft.style.display = 'none';
    }

    // Check Right Door
    if (Game.animatronics.chica.location === 'office-right') {
        UI.monsterRight.style.backgroundImage = getMonsterSprite('chica');
        UI.monsterRight.style.display = 'block';
    } else if (Game.animatronics.freddy.location === 'office-right') {
        // Freddy only visible in light if close
        UI.monsterRight.style.backgroundImage = getMonsterSprite('freddy');
        UI.monsterRight.style.display = 'block';
    } else {
        UI.monsterRight.style.display = 'none';
    }
}

function getMonsterSprite(name) {
    // Procedural placeholders using CSS gradients/colors
    if (name === 'bonnie') return 'radial-gradient(circle, #a8f, #44a)';
    if (name === 'chica') return 'radial-gradient(circle, #ff8, #aa4)';
    if (name === 'freddy') return 'radial-gradient(circle, #853, #421)';
    if (name === 'foxy') return 'radial-gradient(circle, #f44, #811)';
    return 'none';
}

function drainPower(amount = 1) {
    // Base drain + usage
    let drainRate = 0.1 + (Game.usage * 0.15);
    Game.power -= drainRate;
    
    if (Game.power <= 0) {
        Game.power = 0;
        powerOutage();
    }
    updateHUD();
}

function powerOutage() {
    Game.isRunning = false;
    UI.officeBg.style.filter = 'brightness(0.1)';
    UI.doorLeft.classList.remove('closed');
    UI.doorRight.classList.remove('closed');
    UI.lightLeft.classList.remove('light-on');
    UI.lightRight.classList.remove('light-on');
    
    // Freddy plays music then jumpscare
    setTimeout(() => {
        triggerJumpscare('freddy');
    }, 5000);
}

function triggerJumpscare(who) {
    if (!Game.isRunning && Game.power <= 0 && who !== 'freddy') return; // Already dead
    
    Game.isRunning = false;
    AudioSys.playSound('scream', 'one-shot'); // Placeholder
    
    UI.jumpscareImg.style.background = getMonsterSprite(who);
    UI.jumpscareImg.style.width = '300px';
    UI.jumpscareImg.style.height = '300px';
    UI.jumpscareImg.style.borderRadius = '50%';
    
    UI.jumpscare.style.display = 'flex';
    
    setTimeout(() => {
        UI.jumpscare.style.display = 'none';
        gameOver();
    }, 2000);
}

function gameOver() {
    UI.endTitle.textContent = "GAME OVER";
    UI.endTitle.style.color = "#f00";
    UI.endMsg.textContent = "The animatronics got you.";
    UI.endScreen.style.display = 'flex';
}

function winGame() {
    Game.isRunning = false;
    UI.endTitle.textContent = "6:00 AM";
    UI.endTitle.style.color = "#0f0";
    UI.endMsg.textContent = "You survived Night " + Game.night;
    UI.endScreen.style.display = 'flex';
    Game.night++; // Prepare for next night
}

// --- CONTROLS ---

function toggleDoor(side) {
    if (Game.power <= 0 || !Game.isRunning) return;
    
    const isLeft = side === 'left';
    if (isLeft) {
        Game.leftDoorClosed = !Game.leftDoorClosed;
        UI.doorLeft.classList.toggle('closed', Game.leftDoorClosed);
        UI.btnDoorLeft.classList.toggle('active', Game.leftDoorClosed);
        AudioSys.playSound('click');
    } else {
        Game.rightDoorClosed = !Game.rightDoorClosed;
        UI.doorRight.classList.toggle('closed', Game.rightDoorClosed);
        UI.btnDoorRight.classList.toggle('active', Game.rightDoorClosed);
        AudioSys.playSound('click');
    }
    calculateUsage();
}

function toggleLight(side) {
    if (Game.power <= 0 || !Game.isRunning) return;
    
    // Turn off other light first (can't have both on usually in FNAF1)
    if (side === 'left') {
        if (Game.leftLightOn) {
            Game.leftLightOn = false;
            UI.lightLeft.classList.remove('light-on');
            UI.btnLightLeft.classList.remove('active');
        } else {
            Game.leftLightOn = true;
            Game.rightLightOn = false;
            UI.lightLeft.classList.add('light-on');
            UI.lightRight.classList.remove('light-on');
            UI.btnLightLeft.classList.add('active');
            UI.btnLightRight.classList.remove('active');
            
            // Check monster
            if (Game.animatronics.bonnie.location === 'office-left') {
                UI.monsterLeft.style.display = 'block';
                AudioSys.playSound('reveal');
            }
        }
    } else {
        if (Game.rightLightOn) {
            Game.rightLightOn = false;
            UI.lightRight.classList.remove('light-on');
            UI.btnLightRight.classList.remove('active');
        } else {
            Game.rightLightOn = true;
            Game.leftLightOn = false;
            UI.lightRight.classList.add('light-on');
            UI.lightLeft.classList.remove('light-on');
            UI.btnLightRight.classList.add('active');
            UI.btnLightLeft.classList.remove('active');

            // Check monster
            if (Game.animatronics.chica.location === 'office-right' || Game.animatronics.freddy.location === 'office-right') {
                UI.monsterRight.style.display = 'block';
                AudioSys.playSound('reveal');
            }
        }
    }
    calculateUsage();
}

function toggleMonitor() {
    if (Game.power <= 0) return;
    
    Game.isMonitorOpen = !Game.isMonitorOpen;
    UI.cameraScreen.style.display = Game.isMonitorOpen ? 'flex' : 'none';
    UI.monitorBtn.textContent = Game.isMonitorOpen ? 'CLOSE MONITOR' : 'OPEN MONITOR';
    
    if (Game.isMonitorOpen) {
        AudioSys.playSound('static', 'loop');
        renderCamera();
    } else {
        // Stop static sound logic would go here
    }
}

function switchCamera(camId) {
    if (!Game.isMonitorOpen) return;
    Game.currentCam = camId;
    
    // Update buttons
    document.querySelectorAll('.cam-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === camId);
    });
    
    AudioSys.playSound('click');
    AudioSys.playGarble();
    renderCamera();
}

function renderCamera() {
    const cam = CAMERAS.find(c => c.id === Game.currentCam);
    if (!cam) return;

    UI.camName.textContent = `${cam.id}: ${cam.name}`;
    
    // Simulate camera feed with colored background and dots for animatronics
    const color = CAM_COLORS[cam.id] || '#111';
    UI.camImage.style.background = color;
    UI.camImage.src = ''; // Clear real image
    
    // Draw animatronics on canvas or div overlay
    // Simplified: Just text for now or simple dots
    let content = `<div style="color:#0f0; font-family:monospace; text-align:center;">
        <h2>${cam.name}</h2>
        <p>CAM ${cam.id}</p>
        <div style="margin-top:20px; font-size:12px; color:#fff;">`;
    
    // List who is here
    const present = [];
    Object.keys(Game.animatronics).forEach(key => {
        if (Game.animatronics[key].location === cam.id) {
            present.push(key.toUpperCase());
        }
        // Foxy special case
        if (key === 'foxy' && cam.id === '1C') {
             content += `<div style="color:${Game.animatronics.foxy.stage > 0 ? 'red' : 'green'}">
                FOXY STATUS: ${['HIDDEN', 'PEEKING', 'OUT', 'RUNNING'][Game.animatronics.foxy.stage]}
             </div>`;
        }
    });
    
    if (present.length > 0) {
        content += `DETECTED: ${present.join(', ')}`;
    } else {
        content += `NO MOVEMENT DETECTED`;
    }
    
    content += `</div></div>`;
    
    // Create a temporary canvas or use innerHTML on a container inside camImage
    // Since camImage is an <img>, let's put an overlay div instead
    let overlay = document.getElementById('cam-overlay');
    if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'cam-overlay';
        overlay.style.position = 'absolute';
        overlay.style.top = '0'; overlay.style.left = '0';
        overlay.style.width = '100%'; overlay.style.height = '100%';
        overlay.style.pointerEvents = 'none';
        UI.camImage.parentElement.appendChild(overlay);
    }
    overlay.innerHTML = content;
    overlay.style.background = color;
}

function calculateUsage() {
    let usage = 1; // Base (fan)
    if (Game.leftDoorClosed) usage++;
    if (Game.rightDoorClosed) usage++;
    if (Game.leftLightOn) usage++;
    if (Game.rightLightOn) usage++;
    if (Game.isMonitorOpen) usage++;
    
    Game.usage = usage;
    
    // Visual bar
    const colors = ['#0f0', '#0f0', '#ff0', '#f80', '#f00'];
    const idx = Math.min(usage, 4);
    UI.usageFill.style.width = (usage * 20) + '%';
    UI.usageFill.style.background = colors[idx];
    
    updateHUD();
}

function updateOfficeVisuals() {
    // Update classes based on state
    UI.doorLeft.classList.toggle('closed', Game.leftDoorClosed);
    UI.doorRight.classList.toggle('closed', Game.rightDoorClosed);
    
    UI.btnDoorLeft.classList.toggle('active', Game.leftDoorClosed);
    UI.btnDoorRight.classList.toggle('active', Game.rightDoorClosed);
    
    UI.lightLeft.classList.toggle('light-on', Game.leftLightOn);
    UI.lightRight.classList.toggle('light-on', Game.rightLightOn);
    
    UI.btnLightLeft.classList.toggle('active', Game.leftLightOn);
    UI.btnLightRight.classList.toggle('active', Game.rightLightOn);
}

function updateHUD() {
    UI.powerVal.textContent = Math.floor(Game.power);
    UI.usageVal.textContent = Game.usage;
    
    if (Game.power < 20) UI.powerVal.style.color = '#f00';
    else UI.powerVal.style.color = '#fff';
}

function updateTimeDisplay() {
    const h = Game.hour === 0 ? 12 : Game.hour;
    UI.timeDisplay.textContent = `${h} AM`;
}

function showPhoneCall(nightName) {
    UI.phoneGuy.style.display = 'flex';
    document.getElementById('phone-text').textContent = `Uh, hello? Hello hello? Welcome to your new summer job at Freddy Fazbear's Pizza. This is Night ${nightName}. Good luck!`;
    
    setTimeout(() => {
        UI.phoneGuy.style.display = 'none';
    }, 8000);
}

function updateDebug() {
    if (UI.debugPanel.style.display === 'block') {
        UI.debugPanel.innerHTML = `
            Night: ${Game.night}<br>
            Hour: ${Game.hour}<br>
            Power: ${Game.power.toFixed(1)}%<br>
            Usage: ${Game.usage}<br>
            Cam: ${Game.currentCam}<br>
            Bonnie: ${Game.animatronics.bonnie.location}<br>
            Chica: ${Game.animatronics.chica.location}<br>
            Foxy: ${Game.animatronics.foxy.stage}<br>
            FPS: 60
        `;
    }
}

// Start
window.onload = init;

</script>
</body>
</html>
